version: '3.8'

services:
  llm-engine:
    image: ollama/ollama:latest
    container_name: local_llm_engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Initialize the container by pulling the Llama 3.2 model if it doesn't exist
    entrypoint: >
      bash -c "
      ollama serve & 
      sleep 5 && 
      ollama pull llama3.2 && 
      ollama pull nomic-embed-text && 
      wait
      "

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: local_web_app
    hostname: ai-workspace
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      # Set in .env (start.sh creates one with a random password on first run)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-omnitag-admin}
      # Address phones use to open the site; printed into QR codes. start.sh sets it automatically.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Evaluation switches (disable guardrails, inject test claims). Keep 0 in normal use.
      - OMNITAG_TEST_HOOKS=${OMNITAG_TEST_HOOKS:-0}
    depends_on:
      - llm-engine
    # One server for the website and the API
    command: uvicorn server:app --host 0.0.0.0 --port 8000

volumes:
  ollama_data:
